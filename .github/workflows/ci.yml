name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anything-to-api/browser-adapter exec playwright install --with-deps chromium
      - run: bash -n install.sh skills/anything-to-api/scripts/runtime.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
